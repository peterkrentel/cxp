name: CI — deploy validation

# Two gates: fast deterministic unit tests (tests/unit, mocked KV/NATS --
# no live cluster), then an infrastructure-only check that the Helm chart
# actually deploys cleanly in a real Kubernetes cluster. Neither runs the
# LLM test suite or pulls any Ollama models — that stays the in-cluster
# hourly CronJob's job. A small local model is inherently non-deterministic
# (confirmed repeatedly in this project's own history), and a PR gate that
# can fail for reasons unrelated to the actual code change erodes trust in
# the gate fast. deploy-check instead catches the class of bug that already
# bit this project several times: RBAC misconfiguration, resource-limit
# typos, bad image references, template mistakes — things that are
# deterministic and worth blocking a merge on.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # deploy-check spins up a full kind cluster (2-8 min) -- worth skipping
  # when nothing that actually affects a live deploy changed (docs, CI
  # workflow files, unit tests, test-results JSON). Caught live 2026-08-21:
  # a PR touching only .github/workflows/*.yml still ran the full kind
  # cluster for no reason. unit-tests stays unconditional -- it's ~15s,
  # not worth the same treatment.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy_relevant: ${{ steps.filter.outputs.deploy_relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"
          echo "$changed"
          # Anything that actually gets baked into a pod (Helm templates/
          # values, app code baked into ConfigMaps, its own dependencies)
          # or is deploy-check's own workflow definition.
          if echo "$changed" | grep -qE '^(helm/|src/|main\.py$|requirements\.txt$|tests/run_tests\.py$|tests/check_plateau\.py$|scripts/sandbox_reaper\.py$|skills/|\.github/workflows/ci\.yml$)'; then
            echo "deploy_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v

  deploy-check:
    needs: changes
    if: needs.changes.outputs.deploy_relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: cxp-ci
          wait: 120s

      - name: helm lint
        run: helm lint helm/cxp

      - name: helm template (catches rendering errors even lint misses)
        run: helm template cxp helm/cxp > /tmp/rendered.yaml

      - name: Deploy the chart
        run: |
          kubectl create namespace cxp
          # Charts/*.tgz + Chart.lock are already committed — no
          # `helm dependency update` needed, and skipping it avoids CI
          # depending on chart-repo availability.
          helm install cxp helm/cxp --namespace cxp

      - name: Wait for every pod to become Ready
        run: |
          echo "Waiting up to 8 minutes for all cxp pods to be Ready..."
          kubectl wait --for=condition=Ready pods --all -n cxp --timeout=480s

      - name: Show final pod state
        if: always()
        run: |
          kubectl get pods -n cxp -o wide
          kubectl get pvc -n cxp
          kubectl get cronjob -n cxp

      - name: Dump pod logs and describe on failure
        if: failure()
        run: |
          for p in $(kubectl get pods -n cxp -o name); do
            echo "=== describe $p ==="
            kubectl describe "$p" -n cxp || true
            echo "=== logs $p ==="
            kubectl logs "$p" -n cxp --all-containers --prefix || true
          done
