{{- range $name, $cfg := .Values.agents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "cxp-%s" $name }}
  labels:
    app.kubernetes.io/name: cxp
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: {{ printf "cxp-%s" $name }}
  template:
    metadata:
      labels:
        app: {{ printf "cxp-%s" $name }}
    spec:
      {{- if eq $cfg.role "deployer" }}
      serviceAccountName: cxp-deployer
      {{- end }}
      {{- if eq $cfg.role "diagnostician" }}
      serviceAccountName: cxp-diagnostician
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: assemble
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              cp /cm/root/main.py /app/main.py
              cp /cm/root/requirements.txt /app/requirements.txt
              mkdir -p /app/src/agents
              cp /cm/src/*.py /app/src/
              cp /cm/agents/*.py /app/src/agents/
              pip install --quiet --target /app/packages -r /app/requirements.txt
              cp /cm/skills/* /skills/
          volumeMounts:
            - { name: app,       mountPath: /app }
            - { name: skills,    mountPath: /skills }
            - { name: cm-root,   mountPath: /cm/root }
            - { name: cm-src,    mountPath: /cm/src }
            - { name: cm-agents, mountPath: /cm/agents }
            - { name: cm-skills, mountPath: /cm/skills }
        {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
        - name: kubectl
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              case "$(uname -m)" in
                aarch64|arm64) ARCH=arm64 ;;
                *) ARCH=amd64 ;;
              esac
              python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.k8s.io/release/v1.29.0/bin/linux/${ARCH}/kubectl', '/shared-bin/kubectl')"
              chmod +x /shared-bin/kubectl
          volumeMounts:
            - { name: shared-bin, mountPath: /shared-bin }
        {{- end }}
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["python", "/app/main.py"]
          args: ["{{ if eq $cfg.role "dashboard" }}idle{{ else }}{{ $cfg.role }}{{ end }}"]
          env:
            - { name: NATS_URL,       value: "{{ $.Values.natsUrl }}" }
            - { name: OLLAMA_URL,     value: "{{ if eq $name "assessor" }}{{ $.Values.ollamaSmallUrl }}{{ else }}{{ $.Values.ollamaUrl }}{{ end }}" }
            - { name: OLLAMA_MODEL,   value: "{{ if $cfg.model }}{{ $cfg.model }}{{ else }}{{ $.Values.ollamaModel }}{{ end }}" }
            # Real per-instance concurrency ceiling, so acquire_ollama_slot()
            # waits on the same capacity Ollama itself is actually enforcing.
            # Main is explicitly capped at OLLAMA_NUM_PARALLEL=2 (values.yaml);
            # ollama-small has no override, so it runs Ollama's own default (4).
            - { name: OLLAMA_MAX_PARALLEL, value: "{{ if eq $name "assessor" }}4{{ else }}2{{ end }}" }
            - { name: CXP_SKILLS_DIR, value: /skills }
            - { name: CXP_MEMORY_PATH,value: /data/memory.json }
            - { name: PYTHONPATH,     value: /app/packages }
            {{- if eq $cfg.role "deployer" }}
            - { name: CXP_DEPLOY_NAMESPACE, value: cxp-sandbox }
            {{- end }}
            {{- if eq $cfg.role "diagnostician" }}
            - { name: OLLAMA_SMALL_URL, value: "{{ $.Values.ollamaSmallUrl }}" }
            {{- end }}
            {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
            - { name: PATH,           value: "/shared-bin:/usr/local/bin:/usr/bin:/bin" }
            {{- end }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: app,    mountPath: /app }
            - { name: skills, mountPath: /skills }
            - { name: memory, mountPath: /data }
            {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
            - { name: shared-bin, mountPath: /shared-bin }
            {{- end }}
      volumes:
        - { name: app,       emptyDir: {} }
        - { name: skills,    emptyDir: {} }
        - { name: cm-root,   configMap: { name: cxp-app-root } }
        - { name: cm-src,    configMap: { name: cxp-app-src } }
        - { name: cm-agents, configMap: { name: cxp-app-agents } }
        - { name: cm-skills, configMap: { name: "{{ $.Values.skillsConfigMap }}" } }
        - { name: memory,    persistentVolumeClaim: { claimName: cxp-memory } }
        {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
        - { name: shared-bin, emptyDir: {} }
        {{- end }}
{{- end }}
