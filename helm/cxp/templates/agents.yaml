{{- range $name, $cfg := .Values.agents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "cxp-%s" $name }}
  labels:
    app.kubernetes.io/name: cxp
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  # Default Deployment rollout (maxSurge/maxUnavailable both 25%) rounds
  # maxSurge down to 0 for any single-replica Deployment here (cxp-web,
  # cxp-planner, cxp-dashboard, etc.) -- meaning the old pod is torn down
  # BEFORE the new one starts, leaving a real gap where the Service has no
  # healthy backend at all. Found live 2026-08-19: run_tests.py hit
  # "Connection refused" against http://cxp-web:8080 mid-run, caused by
  # exactly this gap during a routine ConfigMap-triggered restart (see
  # #43's checksum annotation). Explicit surge-before-kill eliminates it.
  # Safe across every role here (stateless HTTP services and JetStream
  # queue-group consumers alike) -- the packet idempotency fence
  # (_claim_packet/_mark_packet_done in agent_shell.py) already handles
  # two pods briefly processing the same queue group correctly.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ printf "cxp-%s" $name }}
  template:
    metadata:
      labels:
        app: {{ printf "cxp-%s" $name }}
      annotations:
        # Forces a rolling restart whenever any mounted ConfigMap's actual
        # content changes -- found live 2026-08-19: `helm upgrade` updates
        # a ConfigMap's content fine, but Kubernetes never restarts a
        # Deployment just because a volume-mounted ConfigMap changed. A
        # 39-hour-old cxp-web pod kept serving pre-#39 code (no tier_status
        # in /api/state at all) through two subsequent `make deploy` runs,
        # invisible until manually checked -- `kubectl rollout restart` is
        # not something this project's standing workflow can rely on a
        # human remembering every time.
        checksum/app-code: {{ include (print $.Template.BasePath "/app-code.yaml") $ | sha256sum }}
        checksum/skills-config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      {{- if eq $cfg.role "deployer" }}
      serviceAccountName: cxp-deployer
      {{- end }}
      {{- if eq $cfg.role "diagnostician" }}
      serviceAccountName: cxp-diagnostician
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: assemble
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              cp /cm/root/main.py /app/main.py
              cp /cm/root/requirements.txt /app/requirements.txt
              mkdir -p /app/src/agents
              cp /cm/src/*.py /app/src/
              cp /cm/agents/*.py /app/src/agents/
              pip install --quiet --target /app/packages -r /app/requirements.txt
              cp /cm/skills/* /skills/
          volumeMounts:
            - { name: app,       mountPath: /app }
            - { name: skills,    mountPath: /skills }
            - { name: cm-root,   mountPath: /cm/root }
            - { name: cm-src,    mountPath: /cm/src }
            - { name: cm-agents, mountPath: /cm/agents }
            - { name: cm-skills, mountPath: /cm/skills }
        {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
        - name: kubectl
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              case "$(uname -m)" in
                aarch64|arm64) ARCH=arm64 ;;
                *) ARCH=amd64 ;;
              esac
              python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.k8s.io/release/v1.29.0/bin/linux/${ARCH}/kubectl', '/shared-bin/kubectl')"
              chmod +x /shared-bin/kubectl
          volumeMounts:
            - { name: shared-bin, mountPath: /shared-bin }
        {{- end }}
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["python", "/app/main.py"]
          args: ["{{ if eq $cfg.role "dashboard" }}idle{{ else }}{{ $cfg.role }}{{ end }}"]
          env:
            - { name: NATS_URL,       value: "{{ $.Values.natsUrl }}" }
            - { name: OLLAMA_URL,     value: "{{ if eq $name "assessor" }}{{ $.Values.ollamaSmallUrl }}{{ else }}{{ $.Values.ollamaUrl }}{{ end }}" }
            - { name: OLLAMA_MODEL,   value: "{{ if $cfg.model }}{{ $cfg.model }}{{ else }}{{ $.Values.ollamaModel }}{{ end }}" }
            # Real per-instance concurrency ceiling, so acquire_ollama_slot()
            # waits on the same capacity Ollama itself is actually enforcing.
            # Main is explicitly capped at OLLAMA_NUM_PARALLEL=2 (values.yaml);
            # ollama-small has no override, so it runs Ollama's own default (4).
            - { name: OLLAMA_MAX_PARALLEL, value: "{{ if eq $name "assessor" }}4{{ else }}2{{ end }}" }
            - { name: CXP_SKILLS_DIR, value: /skills }
            - { name: CXP_MEMORY_PATH,value: /data/memory.json }
            - { name: PYTHONPATH,     value: /app/packages }
            {{- if eq $cfg.role "deployer" }}
            - { name: CXP_DEPLOY_NAMESPACE, value: cxp-sandbox }
            {{- end }}
            {{- if eq $cfg.role "diagnostician" }}
            - { name: OLLAMA_SMALL_URL, value: "{{ $.Values.ollamaSmallUrl }}" }
            {{- end }}
            {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
            - { name: PATH,           value: "/shared-bin:/usr/local/bin:/usr/bin:/bin" }
            {{- end }}
            {{- if $.Values.otel.enabled }}
            # Gated behind otel.enabled (default false, see values.yaml) --
            # the auth header lives in a Secret the user creates themselves
            # out-of-band (kubectl create secret, never committed/pasted
            # into chat), so this only activates once that Secret actually
            # exists. init_tracing() (telemetry.py) is a no-op if
            # OTEL_EXPORTER_OTLP_ENDPOINT is unset, so leaving this whole
            # block off by default is a genuine no-op, not degraded mode.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ $.Values.otel.endpoint }}" }
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Values.otel.secretName }}"
                  key: headers
            {{- end }}
          resources:
            # requests were 100m -- real observed usage all night was 1-2m
            # per pod (these are lightweight asyncio processes; the LLM
            # work happens in Ollama, not here). 100m x 9 agent pods (now
            # that verifier has 2 replicas) was enough to tip CI's
            # constrained runner over into "Insufficient cpu" and leave a
            # pod permanently unschedulable, even though production (10
            # real cores) had no such problem. 20m still leaves a healthy
            # margin over actual usage.
            requests: { cpu: 20m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: app,    mountPath: /app }
            - { name: skills, mountPath: /skills }
            - { name: memory, mountPath: /data }
            {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
            - { name: shared-bin, mountPath: /shared-bin }
            {{- end }}
      volumes:
        - { name: app,       emptyDir: {} }
        - { name: skills,    emptyDir: {} }
        - { name: cm-root,   configMap: { name: cxp-app-root } }
        - { name: cm-src,    configMap: { name: cxp-app-src } }
        - { name: cm-agents, configMap: { name: cxp-app-agents } }
        - { name: cm-skills, configMap: { name: "{{ $.Values.skillsConfigMap }}" } }
        - { name: memory,    persistentVolumeClaim: { claimName: cxp-memory } }
        {{- if or (eq $cfg.role "deployer") (eq $cfg.role "diagnostician") }}
        - { name: shared-bin, emptyDir: {} }
        {{- end }}
{{- end }}
