apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cxp-memory
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  # ReadWriteOnce works today only because the kind cluster is single-node —
  # multiple executor replicas can share it as long as they land on the same
  # node. On a multi-node cluster this would block scheduling a replica onto
  # a different node entirely; move to ReadWriteMany (or drop the PVC in
  # favor of the KV_STATE-style shared store used for skills) before that.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.memoryPVC.size }}
  {{- if .Values.memoryPVC.storageClass }}
  storageClassName: {{ .Values.memoryPVC.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.skillsConfigMap }}
data:
  planner_v1.md: |
{{ .Files.Get "skills/planner_v1.md" | indent 4 }}
  executor_v1.md: |
{{ .Files.Get "skills/executor_v1.md" | indent 4 }}
  verifier_v1.md: |
{{ .Files.Get "skills/verifier_v1.md" | indent 4 }}
