---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxp-diagnostician
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxp-diagnostician
  namespace: {{ .Release.Namespace }}
rules:
  # Read-only, and scoped to this namespace only — unlike deployer (which can
  # create/update/delete in cxp-sandbox), diagnostician can only look, never
  # touch. get/list pods + pod metrics is enough to see what deployer/etc
  # were doing and whether the node was under CPU/memory pressure at halt
  # time — the same signal a human would check by hand.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxp-diagnostician
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cxp-diagnostician
subjects:
  - kind: ServiceAccount
    name: cxp-diagnostician
    namespace: {{ .Release.Namespace }}
