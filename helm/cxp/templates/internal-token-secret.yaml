{{/*
Shared secret only cxp-web and the test-runner CronJob know, used to
distinguish the trusted in-cluster candidate-comparison job from any
other caller of the public, unauthenticated /api/submit route (see
sanitize_untrusted_inputs() in src/web_dashboard.py). Generated once and
kept across upgrades via `lookup` -- never set in values.yaml, never
committed to git.
*/}}
{{- $secretName := "cxp-internal-token" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
