apiVersion: batch/v1
kind: CronJob
metadata:
  name: cxp-sandbox-reaper
  namespace: {{ .Release.Namespace }}
spec:
  # Every 15 min -- cheap and independent of whether deployer has run
  # recently. deployer reports success as soon as `kubectl apply` is
  # accepted, never checking whether the pods it creates actually come up,
  # so most deploys (the LLM invents plausible but nonexistent image refs)
  # end up permanently stuck. Found live 2026-08-17: one had sat in
  # ImagePullBackOff for 14+ hours with nothing ever cleaning it up.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # Reuses cxp-deployer's own ServiceAccount -- it already has full
          # CRUD on deployments (get/list/create/update/patch/delete)
          # scoped to cxp-sandbox only (see deployer-rbac.yaml). A
          # dedicated ServiceAccount would grant the exact same access for
          # no extra isolation, just more RBAC surface to keep in sync.
          serviceAccountName: cxp-deployer
          initContainers:
            - name: kubectl
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set -e
                  case "$(uname -m)" in
                    aarch64|arm64) ARCH=arm64 ;;
                    *) ARCH=amd64 ;;
                  esac
                  python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.k8s.io/release/v1.29.0/bin/linux/${ARCH}/kubectl', '/shared-bin/kubectl')"
                  chmod +x /shared-bin/kubectl
                  cp /cm/root/sandbox_reaper.py /shared-bin/sandbox_reaper.py
              volumeMounts:
                - { name: shared-bin, mountPath: /shared-bin }
                - { name: cm-root,    mountPath: /cm/root }
          containers:
            - name: reaper
              image: python:3.12-slim
              command: ["python3", "/shared-bin/sandbox_reaper.py"]
              env:
                - { name: PATH, value: "/shared-bin:/usr/local/bin:/usr/bin:/bin" }
              volumeMounts:
                - { name: shared-bin, mountPath: /shared-bin }
          volumes:
            - { name: shared-bin, emptyDir: {} }
            - { name: cm-root,    configMap: { name: cxp-app-root } }
