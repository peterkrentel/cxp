---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxp-test-runner
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxp-test-runner
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxp-test-runner
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cxp-test-runner
subjects:
  - kind: ServiceAccount
    name: cxp-test-runner
    namespace: {{ .Release.Namespace }}
