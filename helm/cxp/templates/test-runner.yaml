apiVersion: batch/v1
kind: CronJob
metadata:
  name: cxp-test-runner
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: assemble
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /app/src/agents /app/tests/results
                  cp /cm/root/main.py /app/main.py
                  cp /cm/root/requirements.txt /app/requirements.txt
                  cp /cm/root/run_tests.py /app/tests/run_tests.py
                  cp /cm/src/*.py /app/src/
                  cp /cm/agents/*.py /app/src/agents/
                  pip install --quiet --target /app/packages -r /app/requirements.txt
              volumeMounts:
                - { name: app,       mountPath: /app }
                - { name: cm-root,   mountPath: /cm/root }
                - { name: cm-src,    mountPath: /cm/src }
                - { name: cm-agents, mountPath: /cm/agents }
          containers:
            - name: test-runner
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  python /app/tests/run_tests.py
                  # Push results to git if credentials are available
                  if [ -f /git-creds/token ] && [ -f /git-creds/repo ]; then
                    cd /results
                    git config user.email "cxp-bot@localhost"
                    git config user.name "CXP Test Runner"
                    REPO=$(cat /git-creds/repo)
                    TOKEN=$(cat /git-creds/token)
                    git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git" 2>/dev/null || true
                    git add tests/results/ && git commit -m "test results $(date +%Y%m%d_%H%M)" && git push || true
                  fi
              env:
                - { name: NATS_URL,        value: "{{ $.Values.natsUrl }}" }
                - { name: CXP_WEB_API,     value: "http://cxp-web:8080" }
                - { name: PYTHONPATH,      value: /app/packages }
              volumeMounts:
                - { name: app,      mountPath: /app }
                - { name: memory,   mountPath: /data }
                - { name: git-creds, mountPath: /git-creds, readOnly: true }
          volumes:
            - { name: app,       emptyDir: {} }
            - { name: cm-root,   configMap: { name: cxp-app-root } }
            - { name: cm-src,    configMap: { name: cxp-app-src } }
            - { name: cm-agents, configMap: { name: cxp-app-agents } }
            - { name: memory,    persistentVolumeClaim: { claimName: cxp-memory } }
            - name: git-creds
              secret:
                secretName: cxp-git-creds
                optional: true   # pod still runs without secret
