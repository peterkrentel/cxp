apiVersion: batch/v1
kind: CronJob
metadata:
  name: cxp-test-runner
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      # Default backoffLimit is 6 (7 pod attempts). For a systemic failure
      # (e.g. Ollama under load) that just repeats the same failure 7x and
      # delays the Job reaching a terminal state — and therefore its TTL
      # countdown — by up to ~2 hours. One retry is enough to rule out a
      # one-off transient blip without compounding a real outage.
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cxp-test-runner
          initContainers:
            - name: assemble
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /app/src/agents /app/tests/results
                  cp /cm/root/main.py /app/main.py
                  cp /cm/root/requirements.txt /app/requirements.txt
                  cp /cm/root/run_tests.py /app/tests/run_tests.py
                  cp /cm/root/check_plateau.py /app/tests/check_plateau.py
                  cp /cm/root/evaluate_candidate.py /app/tests/evaluate_candidate.py
                  cp /cm/src/*.py /app/src/
                  cp /cm/agents/*.py /app/src/agents/
                  pip install --quiet --target /app/packages -r /app/requirements.txt
              volumeMounts:
                - { name: app,       mountPath: /app }
                - { name: cm-root,   mountPath: /cm/root }
                - { name: cm-src,    mountPath: /cm/src }
                - { name: cm-agents, mountPath: /cm/agents }
          containers:
            - name: test-runner
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set +e
                  # python:3.12-slim ships neither git nor kubectl — both
                  # needed below and previously silently absent (masked by
                  # the old blanket `|| true` on the whole git block, and by
                  # this cleanup step never having been reachable before the
                  # self-delete race fix).
                  apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null 2>&1

                  python -u /app/tests/run_tests.py
                  TEST_EXIT=$?

                  # At most one healthy, previously unevaluated candidate is
                  # compared after each ordinary suite. Its recommendation is
                  # published to KV; it never promotes active skill text.
                  python -u /app/tests/evaluate_candidate.py || echo "⚠ candidate evaluation skipped"

                  # Push results to git if credentials are available. Clones
                  # the real main and commits on top of it (rather than
                  # `git init` from scratch) so the push is a genuine
                  # fast-forward instead of always being rejected and
                  # silently swallowed by `|| true`. Pushes to a dedicated
                  # bot/test-results branch, NEVER main directly — a human
                  # merges that in whenever they choose, on their own
                  # schedule, so the bot can never race a human's own push
                  # to main (which is exactly what happened once already).
                  if [ -f /git-creds/token ] && [ -f /git-creds/repo ]; then
                    REPO=$(cat /git-creds/repo)
                    TOKEN=$(cat /git-creds/token)
                    rm -rf /tmp/repo-push
                    if git clone -q --depth=1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" /tmp/repo-push; then
                      cd /tmp/repo-push
                      git config user.email "cxp-bot@localhost"
                      git config user.name "CXP Test Runner"

                      # Continue the existing bot branch if one's already
                      # out there; otherwise start a fresh one off main.
                      # Checks out FETCH_HEAD, not origin/bot/test-results --
                      # the initial --depth=1 clone restricts the remote's
                      # fetch refspec to just main, so fetching a different
                      # branch afterward pulls the right commit but never
                      # creates an origin/bot/test-results tracking ref (only
                      # the transient FETCH_HEAD). Checking out a ref that
                      # was never created was why every push has failed with
                      # "not a commit" all along -- results were silently
                      # lost on every run since this branch was introduced.
                      if git fetch -q origin bot/test-results 2>/dev/null; then
                        git checkout -q -B bot/test-results FETCH_HEAD
                      else
                        git checkout -q -b bot/test-results
                      fi

                      mkdir -p tests/results
                      cp /app/tests/results/*.json tests/results/ 2>/dev/null || true

                      # Has the fixed suite plateaued? Only this clone (not
                      # the CronJob pod itself) has the full git-tracked run
                      # history to check against.
                      #
                      # Runs /app/tests/check_plateau.py (the ConfigMap-
                      # assembled copy, always matching main), NOT
                      # tests/check_plateau.py from this checkout. The
                      # checkout above just switched HEAD to bot/test-results,
                      # which overwrites the whole working tree -- including
                      # check_plateau.py itself -- with whatever was last
                      # committed there. bot/test-results only ever receives
                      # results-JSON commits, never a merge from main, so its
                      # copy of this script silently drifts arbitrarily far
                      # behind main. Found live 2026-08-19: the entire tiered
                      # promotion rewrite (#38) never actually ran here --
                      # this step kept printing the pre-tiered single-streak
                      # output on every run since, despite main having moved
                      # on. check_plateau.py only reads local JSON files, so
                      # it doesn't need to BE on the branch being analyzed --
                      # pointing at the current /app copy decouples "which
                      # code runs" from "which branch happens to be checked
                      # out," which is the actual fix, not a version pin.
                      python3 /app/tests/check_plateau.py tests/results || true

                      git add tests/results/
                      if git diff --cached --quiet; then
                        echo "No new results to push"
                      elif git commit -q -m "test results $(date +%Y%m%d_%H%M)" && git push -q origin bot/test-results; then
                        echo "✓ Pushed test results to bot/test-results (never main — merge manually when ready)"
                      else
                        echo "⚠ git push failed — see output above"
                      fi
                    else
                      echo "⚠ git clone failed — skipping results push"
                    fi
                  fi

                  # Auto-cleanup: delete this job on success, keep it for
                  # debugging on failure. Runs last, after the push above has
                  # already completed, so it can no longer race its own
                  # trailing git push (this used to happen from inside
                  # run_tests.py, deleting the job mid-push). kubectl isn't
                  # in python:3.12-slim either, so fetch it lazily — only
                  # needed on the success path, which is the rarer case
                  # while things stabilize.
                  if [ "$TEST_EXIT" -eq 0 ] && [ -n "$JOB_NAME" ]; then
                    case "$(uname -m)" in
                      aarch64|arm64) ARCH=arm64 ;;
                      *) ARCH=amd64 ;;
                    esac
                    python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.k8s.io/release/v1.29.0/bin/linux/${ARCH}/kubectl', '/tmp/kubectl')" \
                      && chmod +x /tmp/kubectl \
                      && /tmp/kubectl delete job "$JOB_NAME" -n "$POD_NAMESPACE" \
                      && echo "✓ Cleaned up job: $JOB_NAME" \
                      || echo "Note: could not auto-delete job (ok for local dev)"
                  fi
                  exit "$TEST_EXIT"
              env:
                - { name: NATS_URL,        value: "{{ $.Values.natsUrl }}" }
                - { name: CXP_WEB_API,     value: "http://cxp-web:8080" }
                - { name: PYTHONPATH,      value: /app/packages }
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - { name: app,      mountPath: /app }
                - { name: memory,   mountPath: /data }
                - { name: git-creds, mountPath: /git-creds, readOnly: true }
          volumes:
            - { name: app,       emptyDir: {} }
            - { name: cm-root,   configMap: { name: cxp-app-root } }
            - { name: cm-src,    configMap: { name: cxp-app-src } }
            - { name: cm-agents, configMap: { name: cxp-app-agents } }
            - { name: memory,    persistentVolumeClaim: { claimName: cxp-memory } }
            - name: git-creds
              secret:
                secretName: cxp-git-creds
                optional: true   # pod still runs without secret
