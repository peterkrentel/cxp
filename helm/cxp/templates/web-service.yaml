apiVersion: v1
kind: Service
metadata:
  name: cxp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cxp
    app.kubernetes.io/component: web-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: cxp-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cxp-web
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cxp-web
                port:
                  number: 8080
