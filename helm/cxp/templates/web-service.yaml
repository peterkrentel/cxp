apiVersion: v1
kind: Service
metadata:
  name: cxp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cxp
    app.kubernetes.io/component: web-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: cxp-web
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cxp-web
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: cxp-web
          port: 8080
