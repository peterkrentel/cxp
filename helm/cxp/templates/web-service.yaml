apiVersion: v1
kind: Service
metadata:
  name: cxp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cxp
    app.kubernetes.io/component: web-dashboard
spec:
  type: {{ .Values.webService.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.webService.port | default 8080 }}
      targetPort: 8080
      {{- if eq (.Values.webService.type | default "ClusterIP") "NodePort" }}
      nodePort: {{ .Values.webService.nodePort | default 30080 }}
      {{- end }}
  selector:
    app: cxp-web
