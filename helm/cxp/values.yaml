## --------------------------------------------------------------------------- #
## Global                                                                       #
## --------------------------------------------------------------------------- #
image:
  repository: cxp-agent
  tag: latest
  pullPolicy: IfNotPresent

natsUrl: "nats://cxp-nats:4222"
ollamaUrl: "http://cxp-ollama:11434"
ollamaModel: "qwen2.5:1.5b"
# assessor is the only agent on the 0.5b model — routed to its own Ollama
# instance (below) so it doesn't compete with everyone else's 1.5b calls
# on the same CPU allocation. See ollama-small.
ollamaSmallUrl: "http://cxp-ollama-small:11434"

## --------------------------------------------------------------------------- #
## Ollama sub-chart overrides — main instance (planner/executor/verifier/reflect,
## all qwen2.5:1.5b)                                                            #
## --------------------------------------------------------------------------- #
ollama:
  ollama:
    models: []    # models already cached in PVC; auto-pull causes PostStartHook failure
  service:
    type: ClusterIP
    port: 11434
  persistentVolume:
    enabled: true
    size: 10Gi
  # Previously unset — Ollama had zero resource limits and was observed
  # running TWO llama_server runner processes (one per loaded model)
  # simultaneously consuming ~470% CPU EACH, on a 10-core node already
  # sitting at a load average of 25. That's not "small model is slow" —
  # it's Ollama unboundedly starving everything else, including itself
  # (confirmed: "timed out waiting for llama runner to start: context
  # canceled" — a new runner failed to even start in time under the load,
  # producing real 500s, not just latency).
  #
  # Shrunk from 5 CPU/4Gi now that assessor's 0.5b load moves to its own
  # instance below — total demand across both stays about the same instead
  # of just adding a second full allocation on top.
  resources:
    requests: { cpu: "1.5", memory: "1.5Gi" }
    limits:   { cpu: "3.5", memory: "3Gi" }
  extraEnv:
    - { name: OLLAMA_NUM_PARALLEL, value: "2" }   # default 4 — halves per-runner thread footprint within the new CPU budget

## --------------------------------------------------------------------------- #
## Ollama sub-chart overrides — small instance (assessor only, qwen2.5:0.5b).
## Exists solely so assessor's concurrent fan-out call (verifier always fires
## assessor + reflect at the same instant on every pass) lands on a separate
## process instead of competing with reflect's 1.5b call for the same CPU
## allocation on the main instance above — that collision was still causing
## timeouts even after the main instance got its own resource limits.
## --------------------------------------------------------------------------- #
ollama-small:
  ollama:
    models: []   # pull qwen2.5:0.5b into this instance's PVC manually after first deploy
  service:
    type: ClusterIP
    port: 11434
  persistentVolume:
    enabled: true
    size: 4Gi   # only ever holds the one small model
  resources:
    requests: { cpu: "0.5", memory: "0.5Gi" }
    limits:   { cpu: "1.5", memory: "1.5Gi" }

## --------------------------------------------------------------------------- #
## NATS sub-chart overrides                                                     #
## --------------------------------------------------------------------------- #
nats:
  config:
    jetstream:
      enabled: true
    cluster:
      enabled: false
  service:
    port: 4222

## --------------------------------------------------------------------------- #
## Shared volumes                                                               #
## --------------------------------------------------------------------------- #
skillsConfigMap: cxp-skills   # created by Helm from skills/
memoryPVC:
  size: 1Gi
  storageClass: standard

## --------------------------------------------------------------------------- #
## Traefik ingress controller                                                   #
## --------------------------------------------------------------------------- #
traefik:
  deployment:
    replicas: 1
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
  service:
    type: NodePort
  ports:
    web:
      nodePort: 32080
      hostPort: 80
  providers:
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: true
    kubernetesCRD:
      enabled: true
  ingressClass:
    enabled: true
    isDefaultClass: true

## --------------------------------------------------------------------------- #
## Web Dashboard Service                                                        #
## --------------------------------------------------------------------------- #
webService:
  type: ClusterIP      # Traefik handles external access now
  port: 8080

## --------------------------------------------------------------------------- #
agents:
  planner:
    replicas: 1
    role: planner
    model: qwen2.5:1.5b   # use cached model
  executor:
    replicas: 2
    role: executor
    model: qwen2.5:1.5b   # use cached model
  verifier:
    # Bumped from 1 -> 2 2026-08-17: verify was the pipeline's real
    # bottleneck under sustained load -- confirmed live via a direct
    # backlog peek (30+ distinct real tasks queued, oldest 45+ minutes),
    # while every other capability had already drained. Ollama's shared
    # concurrency ceiling had real headroom (assessor's own instance was
    # idle, node CPU at ~37%), so the constraint was "only one process
    # pulling from verify's queue," not "not enough inference slots" --
    # a second replica uses that already-idle capacity directly.
    replicas: 2
    role: verifier
    model: qwen2.5:1.5b   # use cached model
  reflect:
    # Bumped from 1 -> 2 2026-08-18, same reasoning and same treatment as
    # verifier's earlier bump: confirmed live it shares the identical
    # structural bottleneck (single replica competing for the same shared
    # main-instance Ollama concurrency ceiling with planner/executor/
    # verifier/diagnostician), and its own prompts skew larger (rewriting
    # a whole skill file, observed up to ~3500 chars vs verify's typical
    # few hundred), likely making individual calls slower on average too.
    replicas: 2
    role: reflect
    model: qwen2.5:1.5b   # use cached model
  dashboard:
    replicas: 1
    role: dashboard
    model: ""
  web:
    replicas: 1
    role: web
    model: ""
  assessor:
    replicas: 1
    role: assessor
    model: qwen2.5:0.5b   # fast — just needs to label
  deployer:
    replicas: 1
    role: deployer
    model: ""             # no LLM needed — runs kubectl/python directly
  diagnostician:
    replicas: 1
    role: diagnostician
    model: qwen2.5:1.5b   # use cached model — needs kubectl too, read-only RBAC (see diagnostician-rbac.yaml)
