## --------------------------------------------------------------------------- #
## Global                                                                       #
## --------------------------------------------------------------------------- #
image:
  repository: cxp-agent
  tag: latest
  pullPolicy: IfNotPresent

natsUrl: "nats://cxp-nats:4222"
ollamaUrl: "http://cxp-ollama:11434"
ollamaModel: "qwen2.5:1.5b"

## --------------------------------------------------------------------------- #
## Ollama sub-chart overrides                                                   #
## --------------------------------------------------------------------------- #
ollama:
  ollama:
    models:
      - qwen2.5:0.5b
      - qwen2.5:1.5b
  service:
    type: ClusterIP
    port: 11434
  persistentVolume:
    enabled: true
    size: 10Gi

## --------------------------------------------------------------------------- #
## NATS sub-chart overrides                                                     #
## --------------------------------------------------------------------------- #
nats:
  config:
    jetstream:
      enabled: true
    cluster:
      enabled: false
  service:
    port: 4222

## --------------------------------------------------------------------------- #
## Shared volumes                                                               #
## --------------------------------------------------------------------------- #
skillsConfigMap: cxp-skills   # created by Helm from skills/
memoryPVC:
  size: 1Gi
  storageClass: standard

## --------------------------------------------------------------------------- #
## Traefik ingress controller                                                   #
## --------------------------------------------------------------------------- #
traefik:
  service:
    type: NodePort
  ports:
    web:
      nodePort: 32080
      hostPort: 80     # maps to kind extraPortMapping containerPort: 80
  providers:
    kubernetesIngress:
      enabled: true

## --------------------------------------------------------------------------- #
## Web Dashboard Service                                                        #
## --------------------------------------------------------------------------- #
webService:
  type: ClusterIP      # Traefik handles external access now
  port: 8080

## --------------------------------------------------------------------------- #
agents:
  planner:
    replicas: 1
    role: planner
    model: qwen2.5:0.5b   # fast — just needs to decompose tasks
  executor:
    replicas: 2
    role: executor
    model: qwen2.5:1.5b   # quality output
  verifier:
    replicas: 1
    role: verifier
    model: qwen2.5:0.5b   # fast — just needs to score
  reflect:
    replicas: 1
    role: reflect
    model: qwen2.5:1.5b   # needs to reason about improvements
  dashboard:
    replicas: 1
    role: dashboard
    model: ""
  web:
    replicas: 1
    role: web
    model: ""
