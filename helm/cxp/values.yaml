## --------------------------------------------------------------------------- #
## Global                                                                       #
## --------------------------------------------------------------------------- #
image:
  repository: cxp-agent
  tag: latest
  pullPolicy: IfNotPresent

natsUrl: "nats://cxp-nats:4222"
ollamaUrl: "http://cxp-ollama:11434"
ollamaModel: "qwen2.5:1.5b"

## --------------------------------------------------------------------------- #
## Ollama sub-chart overrides                                                   #
## --------------------------------------------------------------------------- #
ollama:
  ollama:
    models: []    # models already cached in PVC; auto-pull causes PostStartHook failure
  service:
    type: ClusterIP
    port: 11434
  persistentVolume:
    enabled: true
    size: 10Gi
  # Previously unset — Ollama had zero resource limits and was observed
  # running TWO llama_server runner processes (one per loaded model)
  # simultaneously consuming ~470% CPU EACH, on a 10-core node already
  # sitting at a load average of 25. That's not "small model is slow" —
  # it's Ollama unboundedly starving everything else, including itself
  # (confirmed: "timed out waiting for llama runner to start: context
  # canceled" — a new runner failed to even start in time under the load,
  # producing real 500s, not just latency).
  resources:
    requests: { cpu: "2", memory: "2Gi" }   # guaranteed baseline, wins scheduling priority
    limits:   { cpu: "5", memory: "4Gi" }   # hard cap — was able to take ~9.4 of 10 cores unbounded
  extraEnv:
    - { name: OLLAMA_NUM_PARALLEL, value: "2" }   # default 4 — halves per-runner thread footprint within the new CPU budget

## --------------------------------------------------------------------------- #
## NATS sub-chart overrides                                                     #
## --------------------------------------------------------------------------- #
nats:
  config:
    jetstream:
      enabled: true
    cluster:
      enabled: false
  service:
    port: 4222

## --------------------------------------------------------------------------- #
## Shared volumes                                                               #
## --------------------------------------------------------------------------- #
skillsConfigMap: cxp-skills   # created by Helm from skills/
memoryPVC:
  size: 1Gi
  storageClass: standard

## --------------------------------------------------------------------------- #
## Traefik ingress controller                                                   #
## --------------------------------------------------------------------------- #
traefik:
  deployment:
    replicas: 1
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
  service:
    type: NodePort
  ports:
    web:
      nodePort: 32080
      hostPort: 80
  providers:
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: true
    kubernetesCRD:
      enabled: true
  ingressClass:
    enabled: true
    isDefaultClass: true

## --------------------------------------------------------------------------- #
## Web Dashboard Service                                                        #
## --------------------------------------------------------------------------- #
webService:
  type: ClusterIP      # Traefik handles external access now
  port: 8080

## --------------------------------------------------------------------------- #
agents:
  planner:
    replicas: 1
    role: planner
    model: qwen2.5:1.5b   # use cached model
  executor:
    replicas: 2
    role: executor
    model: qwen2.5:1.5b   # use cached model
  verifier:
    replicas: 1
    role: verifier
    model: qwen2.5:1.5b   # use cached model
  reflect:
    replicas: 1
    role: reflect
    model: qwen2.5:1.5b   # use cached model
  dashboard:
    replicas: 1
    role: dashboard
    model: ""
  web:
    replicas: 1
    role: web
    model: ""
  assessor:
    replicas: 1
    role: assessor
    model: qwen2.5:0.5b   # fast — just needs to label
  deployer:
    replicas: 1
    role: deployer
    model: ""             # no LLM needed — runs kubectl/python directly
