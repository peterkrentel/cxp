kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cxp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 4222
        hostPort: 4222
        protocol: TCP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
